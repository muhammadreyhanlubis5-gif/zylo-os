name: Build and Deploy ZYLO OS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Arduino Sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32c3
          sketch-paths: |
            - firmware/gen1_core
            - firmware/gen2_smart
            - firmware/gen3_cellular
          libraries: |
            - name: Adafruit GFX Library
            - name: Adafruit SSD1306
          cli-compile-flags: |
            - -e

      - name: Prepare Web Flasher Assets
        run: |
          # Gen 1
          find firmware/gen1_core/build -name "*.ino.bin" -exec cp {} web_flasher/zylo_v1.0.bin \;
          # Gen 2
          find firmware/gen2_smart/build -name "*.ino.bin" -exec cp {} web_flasher/zylo_v2.0.bin \;
          # Gen 3
          find firmware/gen3_cellular/build -name "*.ino.bin" -exec cp {} web_flasher/zylo_v3.0.bin \;

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web_flasher'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
